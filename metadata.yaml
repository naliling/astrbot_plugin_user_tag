name: astrbot_plugin_user_tag
display_name: 关系识别
short_desc: 一句话设定你和 AI 的关系，可让它自己记，全部靠聊天指令
desc: |
  「设置关系 病娇」→ 下一句 AI 就不正常了（褒义）。
  懒得选？直接跟它说「以后你当我女朋友」，它会先问你要不要记下来，你点头才算。
  139 种预设关系分 9 类，只收「人和人之间是什么关系」，场景标签类已清掉；
  「设置关系 恋人 灰凝」一条消息就把关系和你希望 AI 怎么称呼你都设完。
  管理员能 @某人 代管关系，关系管理 / 查看所有关系 / 关系统计 都能在聊天里查。
  关系提示每条消息都发给模型但从不写进会话历史，长对话几乎零额外 token。
version: 2.4.2
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_user_tag
astrbot_version: ">=4.0.0"
main: main.py
support_platforms:
  - aiocqhttp
  - qq_official
  # 暂不声明 telegram / discord / wecom：@代管靠 At 组件的 qq 字段，
  # 那是 OneBot 的形状，其他平台未实测。实际只用到 get_group_id / get_sender_id
  # 这类通用接口，声明前得先在真平台上跑一遍。

tags:
  - 关系管理
  - 上下文注入
  - 角色扮演
  - AI交互

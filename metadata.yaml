name: astrbot_plugin_user_tag
display_name: 关系识别
short_desc: 说一句你们是什么关系，下一句 AI 就按这个关系说话
desc: 说一句「设置关系 恋人」，下一句它就把你当恋人说话；139 种预设关系分 9 类，不够就自己编一个名字。另带一个网页面板：改关系、翻变更历史、调注入模板。
version: 2.6.2
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_user_tag
astrbot_version: ">=4.0.0"
main: main.py
support_platforms:
  - aiocqhttp
  - qq_official
  # 暂不声明 telegram / discord / wecom：@代管靠 At 组件的 qq 字段，
  # 那是 OneBot 的形状，其他平台未实测。实际只用到 get_group_id / get_sender_id
  # 这类通用接口，声明前得先在真平台上跑一遍。

tags:
  - 关系管理
  - 上下文注入
  - 角色扮演
  - AI交互
  - 数据面板
  - 插件互联

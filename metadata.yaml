name: astrbot_plugin_user_tag
display_name: 关系识别
short_desc: 设置你和AI的关系，让AI根据关系调整交流方式！
desc: |
  132 种预设关系分 10 类（日常/亲友/恋爱/心动/恋爱设定/身份/服务/主仆/奇幻/玩梗），
  角色扮演向的关系会明确标注，也支持任意自定义关系名。
  每个用户按机器人独立设置，AI 会按这段关系调整称呼、语气和距离感。
  关系提示整段会话只注入一次，不会每发一句就重复塞给模型。
  管理员可以查看全部关系和统计。
version: 1.4.0
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_user_tag
astrbot_version: ">=4.0.0"
main: main.py
support_platforms:
  - aiocqhttp
  - qq_official

tags:
  - 关系管理
  - 上下文注入
  - 角色扮演
  - AI交互

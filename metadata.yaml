name: astrbot_plugin_user_tag
display_name: 关系识别
short_desc: 一句话设定你和 AI 的关系，可自动认定，语气称呼立刻不一样
desc: |
  「设置关系 病娇」→ 下一句 AI 就不正常了（褒义）。
  懒得选？AI 会根据你们的聊天记录自动认定关系，用户确认即可。
  管理员能 @某人 代管关系，还能按群/私聊黑白名单控制插件开关。
  关系提示整段会话只注入一次，长对话几乎零额外 token。
  132 种预设关系分 10 类，角色扮演向明确标注，也支持任意自定义关系名。
version: 1.4.3
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_user_tag
astrbot_version: ">=4.0.0"
main: main.py
support_platforms:
  - aiocqhttp
  - qq_official

tags:
  - 关系管理
  - 上下文注入
  - 角色扮演
  - AI交互
